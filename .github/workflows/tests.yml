name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Solo stdlib: corre antes de instalar Qiskit para separar fallas de datos.
      - name: Data (case contract + regressions)
        run: |
          python tools/validate_cases.py
          python -m unittest tests.test_cases_data -v

      - name: Install dependencies
        run: python -m pip install qiskit==2.5.2 numpy scipy

      - name: Unit tests (all of tests/)
        run: python -m unittest discover -s tests -v

      # Solo se comprueban las partes deterministas de la salida; QAOA es estocastico.
      - name: Baseline regression (python baseline.py)
        run: |
          python baseline.py | tee baseline.out
          grep -F "Greedy : sitios [2, 5, 6] -> 1845 mil" baseline.out
          grep -F "Exacta : sitios [1, 2, 5] -> 2086 mil" baseline.out
          grep -F "Mediciones con exactamente 3 ambulancias: 100.0%" baseline.out
